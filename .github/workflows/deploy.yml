name: Deploy Observatory

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: observatory-production
  cancel-in-progress: false

jobs:
  production:
    name: Migrate and deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.OBSERVATORY_PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run deploy:dry-run
      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm run db:migrate:production
      - name: Deploy Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm run deploy:pages -- --commit-hash "$GITHUB_SHA" --commit-message "production $GITHUB_SHA"
      - name: Deploy probe Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npm run deploy:probes -- --message "production $GITHUB_SHA"
      - name: Verify production API
        env:
          OBSERVATORY_PRODUCTION_URL: ${{ vars.OBSERVATORY_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          test -n "$OBSERVATORY_PRODUCTION_URL"
          npm run verify:production
      - name: Record release revision and migration state
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          OBSERVATORY_PRODUCTION_URL: ${{ vars.OBSERVATORY_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          {
            echo "## Observatory production release"
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
            echo "- Production URL: \`$OBSERVATORY_PRODUCTION_URL\`"
            echo "### D1 migration state"
            npx wrangler d1 migrations list atrinik-observatory --remote -c wrangler.jsonc --env production
          } >> "$GITHUB_STEP_SUMMARY"
