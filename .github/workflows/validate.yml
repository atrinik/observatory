name: Validate Observatory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate dashboard and Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Test dependency audit delta
        run: node --test test-node/audit-*.node.mjs
      - name: Compare dependency audit delta
        run: node scripts/audit-delta.mjs
      - run: npm ci
      - name: Apply migrations to isolated local D1
        run: npm run db:migrate:local
      - run: npm run check
      - run: npm run build
      - run: npm run deploy:dry-run
      - name: Ensure validation leaves tracked sources clean
        run: test -z "$(git status --short)"
